version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    bundler:
      applies-to: version-updates
      patterns: [ "*" ]
      update-types: [ "minor", "patch" ]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    github-actions:
      applies-to: version-updates
      patterns: [ "*" ]
      update-types: [ "minor", "patch" ]
